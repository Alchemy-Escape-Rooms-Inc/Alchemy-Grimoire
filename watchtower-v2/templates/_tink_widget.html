{# Tink — floating chat widget, included on every page by base.html. #}
{# Server keeps the transcript, so she follows the operator from tab to tab. #}
<style>
#tink-widget {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 150; /* under modals (200) so dialogs still cover her */
    font-family: 'Plus Jakarta Sans', sans-serif;
}
#tink-bubble {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 1px solid var(--border-accent);
    background: var(--bg-card);
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.45);
    transition: transform 0.15s ease;
}
#tink-bubble:hover { transform: scale(1.08); }
#tink-panel {
    display: none;
    flex-direction: column;
    width: 380px;
    height: min(560px, calc(100vh - 96px));
    background: var(--bg);
    border: 1px solid var(--border-accent);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.55);
    overflow: hidden;
}
#tink-widget.open #tink-bubble { display: none; }
#tink-widget.open #tink-panel { display: flex; }
#tink-widget.big #tink-panel {
    width: min(680px, calc(100vw - 36px));
    height: calc(100vh - 96px);
}
.tink-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
}
.tink-header .tink-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-bright);
}
.tink-header .tink-sub {
    font-size: 11px;
    color: var(--text-dim);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.tink-header button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 6px;
}
.tink-header button:hover { color: var(--text-bright); background: rgba(255,255,255,0.06); }
#tink-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.tink-msg {
    max-width: 86%;
    padding: 10px 13px;
    border-radius: 13px;
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
}
.tink-msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
}
.tink-msg.tink {
    align-self: flex-start;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
}
.tink-msg.tink code, .tink-msg.user code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 4px;
}
.tink-msg.tink pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    overflow-x: auto;
    margin: 7px 0;
}
.tink-msg.tink pre code { background: none; padding: 0; }
.tink-msg.error {
    align-self: center;
    background: rgba(190, 60, 60, 0.12);
    border: 1px solid rgba(190, 60, 60, 0.4);
    color: #E8A0A0;
    font-size: 12.5px;
}
.tink-tools-note {
    align-self: flex-start;
    color: var(--text-muted);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    margin: -7px 0 0 5px;
}
.tink-typing {
    align-self: flex-start;
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 6px 13px;
}
.tink-typing .tink-dots::after {
    content: '';
    animation: tink-dots 1.3s steps(4, end) infinite;
}
@keyframes tink-dots {
    0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
}
.tink-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    align-items: flex-end;
    border-top: 1px solid var(--border);
    background: var(--bg-card);
}
.tink-input-row textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border-accent);
    border-radius: 10px;
    color: var(--text-bright);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13.5px;
    padding: 9px 11px;
    min-height: 38px;
    max-height: 130px;
    outline: none;
}
.tink-input-row textarea:focus { border-color: var(--accent); }
.tink-empty {
    align-self: center;
    text-align: center;
    color: var(--text-dim);
    margin-top: 8vh;
    font-size: 13px;
    line-height: 1.9;
    padding: 0 14px;
}
.tink-empty .tink-big { font-size: 34px; }
</style>

<div id="tink-widget">
    <div id="tink-bubble" title="Tink" onclick="TinkWidget.open()">🧚</div>
    <div id="tink-panel">
        <div class="tink-header">
            <span>🧚</span>
            <span class="tink-title">Tink</span>
            <span class="tink-sub">knows everything WatchTower knows</span>
            <button title="New conversation" onclick="TinkWidget.reset()">🧹</button>
            <button title="Maximize / restore" onclick="TinkWidget.toggleBig()">⛶</button>
            <button title="Minimize" onclick="TinkWidget.close()">➖</button>
        </div>
        <div id="tink-messages"></div>
        <div class="tink-input-row">
            <textarea id="tink-input" rows="1" placeholder="Ask Tink..."></textarea>
            <button class="btn btn-gold" id="tink-send" onclick="TinkWidget.send()">Send</button>
        </div>
    </div>
</div>

<script>
window.TinkWidget = (function () {
    const widget = document.getElementById('tink-widget');
    const msgBox = document.getElementById('tink-messages');
    const input = document.getElementById('tink-input');
    const sendBtn = document.getElementById('tink-send');
    let busy = false;
    let historyLoaded = false;

    const EMPTY_HTML = '<div class="tink-big">🧚</div>' +
        'Hey! It\'s Tink. Ask me anything about the room.<br>' +
        '<span style="font-size:11.5px">"what\'s offline right now" · "why didn\'t the cove door open last game" · "search the mqtt logs for PUZZLE_RESET"</span>';

    function showEmpty(html) {
        msgBox.innerHTML = '<div class="tink-empty" id="tink-empty">' + (html || EMPTY_HTML) + '</div>';
    }
    function hideEmpty() {
        const e = document.getElementById('tink-empty');
        if (e) e.remove();
    }
    function esc(s) {
        return (typeof escapeHtml === 'function')
            ? escapeHtml(s)
            : s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    // Minimal markdown: escape first, then fences, inline code, bold.
    function renderMd(text) {
        let s = esc(text);
        s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => '<pre><code>' + code + '</code></pre>');
        s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
        s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        return s;
    }
    function addMsg(role, text) {
        hideEmpty();
        const div = document.createElement('div');
        div.className = 'tink-msg ' + role;
        div.innerHTML = role === 'tink' ? renderMd(text) : esc(text);
        msgBox.appendChild(div);
        msgBox.scrollTop = msgBox.scrollHeight;
        return div;
    }
    function addToolsNote(tools) {
        if (!tools || !tools.length) return;
        const div = document.createElement('div');
        div.className = 'tink-tools-note';
        div.textContent = '🔍 checked: ' + [...new Set(tools)].join(', ');
        msgBox.appendChild(div);
        msgBox.scrollTop = msgBox.scrollHeight;
    }
    function addTyping() {
        const t = document.createElement('div');
        t.className = 'tink-typing';
        t.innerHTML = '🧚 Tink is sprinkling pixie dust on the logs<span class="tink-dots"></span>';
        msgBox.appendChild(t);
        msgBox.scrollTop = msgBox.scrollHeight;
        return t;
    }
    function autoGrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 130) + 'px';
    }
    function renderHistory(data) {
        msgBox.innerHTML = '';
        const hist = data.history || [];
        if (!hist.length) showEmpty();
        hist.forEach(m => addMsg(m.role === 'user' ? 'user' : 'tink', m.text));
        if (data.has_key === false) {
            addMsg('error',
                'No Anthropic API key configured yet. Set the ANTHROPIC_API_KEY environment variable ' +
                'or paste your key into watchtower-v2\\anthropic_key.txt, then restart WatchTower.');
        }
        return hist;
    }
    async function loadHistory() {
        try {
            const res = await fetch('/api/chat/history');
            const hist = renderHistory(await res.json());
            historyLoaded = true;
            // Navigated away mid-answer? Server finishes the turn; ask again and
            // the request simply blocks until the reply is in the transcript.
            if (hist.length && hist[hist.length - 1].role === 'user') {
                const typing = addTyping();
                const res2 = await fetch('/api/chat/history');
                typing.remove();
                renderHistory(await res2.json());
            }
        } catch (e) { /* widget still usable */ }
    }

    async function send() {
        const text = input.value.trim();
        if (!text || busy) return;
        busy = true;
        sendBtn.disabled = true;
        input.value = '';
        localStorage.removeItem('tink_draft');
        autoGrow();
        addMsg('user', text);
        const typing = addTyping();
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text }),
            });
            const data = await res.json();
            typing.remove();
            if (data.error) {
                addMsg('error', data.error);
            } else {
                addMsg('tink', data.reply);
                addToolsNote(data.tools_used);
            }
        } catch (e) {
            typing.remove();
            addMsg('error', 'Lost contact with WatchTower: ' + e.message);
        } finally {
            busy = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    async function reset() {
        if (busy) return;
        await fetch('/api/chat/reset', { method: 'POST' });
        showEmpty('<div class="tink-big">🧚</div>Fresh sparkle! What\'s next?');
        input.focus();
    }

    function open() {
        widget.classList.add('open');
        localStorage.setItem('tink_open', '1');
        if (!historyLoaded) loadHistory();
        input.focus();
    }
    function close() {
        widget.classList.remove('open');
        localStorage.setItem('tink_open', '0');
    }
    function toggleBig() {
        widget.classList.toggle('big');
        localStorage.setItem('tink_big', widget.classList.contains('big') ? '1' : '0');
    }

    input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && !ev.shiftKey) {
            ev.preventDefault();
            send();
        }
    });
    input.addEventListener('input', () => {
        autoGrow();
        localStorage.setItem('tink_draft', input.value);
    });

    // Restore state so she follows the operator between tabs.
    input.value = localStorage.getItem('tink_draft') || '';
    if (input.value) autoGrow();
    if (localStorage.getItem('tink_big') === '1') widget.classList.add('big');
    showEmpty();
    if (localStorage.getItem('tink_open') === '1') {
        widget.classList.add('open');
        loadHistory();
    }

    return { open, close, toggleBig, send, reset };
})();
</script>
